# Regenera assets/tecnologias.svg (lenguajes de los repositorios públicos) todos los días.
# Usa el token que GitHub da a cada Action: no hace falta crear claves.
name: Tarjeta de tecnologías

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/tecnologias.mjs, .github/workflows/tecnologias.yml]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generar la tarjeta
        run: node scripts/tecnologias.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USUARIO: ${{ github.repository_owner }}
      - name: Guardar si cambió
        run: |
          git add assets/tecnologias.svg
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: actualizar tarjeta de tecnologías"
          git push
